name: FS unified routing and evidence guard
on:
  push:
    branches:
      - main
      - feat/fs-unified-orchestration-20261124
    paths:
      - '.github/workflows/fs-unified-orchestration-test.yml'
      - 'tools/agent_orchestration/**'
      - '.agents/skills/fs-rmvx-router/SKILL.md'
      - 'AGENTS.md'
      - 'ASSET_GENERATION_PRECHECK.md'
      - 'docs/FS_CHATGPT_PROJECT_BOOTSTRAP_20261124.md'
      - 'authority/FS_CURRENT_RULES_INDEX_20261107.md'
      - 'authority/FS_UNIFIED_CONTROL_PROTOCOL_20261124.md'
  pull_request:
    paths:
      - '.github/workflows/fs-unified-orchestration-test.yml'
      - 'tools/agent_orchestration/**'
      - '.agents/skills/fs-rmvx-router/SKILL.md'
      - 'AGENTS.md'
      - 'authority/FS_CURRENT_RULES_INDEX_20261107.md'
      - 'authority/FS_UNIFIED_CONTROL_PROTOCOL_20261124.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout audited FS branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python stdlib read-only routing and evidence tests
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m unittest discover -s tools/agent_orchestration -p 'test_*.py' -v
      - name: Live-activation refusal and explicit lane smoke
        shell: bash
        run: |
          set -euo pipefail
          for lane in T-A T-B T-C GODOT CONTROL; do
            python3 tools/agent_orchestration/route_task.py --lane "$lane" | \
              python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["formal_engine"]=="Godot 4.7.2"; assert x["execution_allowed"] is False; assert x["auto_use_of_skills_verified"] is False; assert x["requires_live_fetch"] is True'
          done
          python3 tools/agent_orchestration/validate_evidence.py tools/agent_orchestration/proof_template.json
          echo 'FS_UNIFIED_ROUTER_OFFLINE_GUARDS_PASS (no provider/PC/private art used)'
