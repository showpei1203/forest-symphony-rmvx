name: FS EGM boot parity pilot
on:
  push:
    branches: [feat/fs-godot-egm-p538f-audit-20261125]
    paths:
      - "godot_port/**"
      - ".github/workflows/fs-egm-boot-pilot.yml"
permissions:
  contents: read
jobs:
  synthetic-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate shared synthetic bundles and report baseline Python discrepancies
        run: python3 godot_port/tools/egm_boot_parity_probe.py "$RUNNER_TEMP/egm-fixtures"
      - name: Download official pinned Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/egm-engine
          chmod +x /tmp/egm-engine/Godot_v4.7.2-stable_linux.x86_64
          /tmp/egm-engine/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project
        run: /tmp/egm-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --editor --quit
      - name: Run actual JSON disk-load parity probe, diagnostic mode
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s /tmp/egm-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_egm_boot_parity_probe.gd -- "$RUNNER_TEMP/egm-fixtures"
