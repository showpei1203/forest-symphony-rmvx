name: FS Flow Motion Factory native QA
on:
  push:
    branches: [feat/fs-flow-attack8-body-20261126]
    paths:
      - 'tools/agent_orchestration/flow_motion_factory/**'
      - '.github/workflows/fs-flow-motion-factory.yml'
  pull_request:
    branches: [feat/fs-agent-sprite-forge-20261125]
    paths:
      - 'tools/agent_orchestration/flow_motion_factory/**'
      - '.github/workflows/fs-flow-motion-factory.yml'
permissions:
  contents: read
jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Exact Godot runtime
        run: |
          curl -fsSL --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          test "$(/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version)" = "4.7.2.stable.official.ed1daf0bf"
      - name: Synthetic in-memory regression then explicit synthetic disk fixture
        run: |
          set -euo pipefail
          cd tools/agent_orchestration/flow_motion_factory
          test ! -e motions/attack
          G=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$G" --headless --editor --quit
          "$G" --headless --fixed-fps 240 --script res://test_factory.gd | tee /tmp/factory.log
          grep 'FLOW_FACTORY_NATIVE_PASS scope=SYNTHETIC_ONLY actions=5 oneshots=4 loop=1' /tmp/factory.log
          python3 -m pip install Pillow==12.3.0
          python3 -m unittest -v test_pose_review.py
          python3 make_fixture.py
          "$G" --headless --fixed-fps 240 --script res://test_factory.gd -- --synthetic-disk | tee /tmp/disk.log
          grep 'FLOW_FACTORY_NATIVE_PASS scope=SYNTHETIC_DISK actions=5 oneshots=4 loop=1' /tmp/disk.log
