name: FS T-C D20 Verified Godot 4.7.2 Linux Binary Transport (NO ART)
on:
  push:
    branches:
      - feat/fs-tc-d12-chroma-par-20261122
    paths:
      - ".github/workflows/fs-tc-d20-godot472-binary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-godot472-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download official exact Godot 4.7.2 x86_64 binary without project art
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/Godot472.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p godot_native
          unzip -q /tmp/Godot472.zip -d godot_native
          test -f godot_native/Godot_v4.7.2-stable_linux.x86_64
          chmod +x godot_native/Godot_v4.7.2-stable_linux.x86_64
          version=$(godot_native/Godot_v4.7.2-stable_linux.x86_64 --version)
          echo "Official Godot version: $version"
          [[ "$version" == 4.7.2.stable.official.* ]]
          sha256sum godot_native/Godot_v4.7.2-stable_linux.x86_64 | tee godot_native/GODOT_4_7_2_SHA256.txt
          cat > godot_native/PROVENANCE.txt <<'TXT'
          Official Godot Engine 4.7.2 stable x86_64 Linux from:
          https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          No Forest Symphony private art or game binary is included in this artifact.
          Godot is distributed under the MIT license.
          This artifact is for one-turn trusted ephemeral local QA only.
          TXT
      - name: Upload engine binary only, temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: fs-tc-d20-official-godot472-linux-x86_64-only
          path: godot_native/
          retention-days: 1
          if-no-files-found: error
