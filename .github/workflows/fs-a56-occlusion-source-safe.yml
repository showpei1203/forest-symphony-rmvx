name: FS A56 Real-Body Occlusion Source-Safe Tests
on:
  push:
    branches: [feature/fs-a56-real-a53-occlusion-20261118]
    paths:
      - 'experiments/fs_a56_real_occlusion/**'
      - '.github/workflows/fs-a56-occlusion-source-safe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a56-source-safe-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image checks
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<14'
      - name: Run 12 independent negative and positive regression cases
        working-directory: experiments/fs_a56_real_occlusion
        run: python -m unittest -v test_a56_real_body_occlusion.py
      - name: Run standalone positive/negative witness
        working-directory: experiments/fs_a56_real_occlusion
        run: python a56_real_body_occlusion.py --selftest
      - name: Confirm private source is not committed
        shell: bash
        run: |
          test ! -f experiments/fs_a56_real_occlusion/actor01_a53_body_12frames.png
          test ! -f experiments/fs_a56_real_occlusion/FS_original_Iconset.png
          echo 'A56_PRIVATE_ARTWORK_NOT_IN_PUBLIC_REPO_PASS'
