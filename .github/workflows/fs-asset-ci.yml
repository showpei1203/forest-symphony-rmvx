name: FS asset static QA (synthetic only)

on:
  pull_request:
    paths:
      - "tools/asset_factory/**"
      - "docs/asset_factory/**"
      - ".github/workflows/fs-asset-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-static-gates:
    name: Sprite and map fail-closed unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deterministic dependencies
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Validate syntax
        run: python -m compileall -q tools/asset_factory
      - name: Run synthetic pass and intentional-fail fixtures
        run: python -m unittest discover -s tools/asset_factory/tests -v

# No secrets, PixelLab calls, user-PC files, native VX claims or private assets.
