name: FS Flow ATTACK8 Body-only native regression
on:
  push:
    branches: [feat/fs-flow-attack8-body-20261126]
    paths:
      - 'tools/agent_orchestration/flow_attack8_preview/**'
      - '.github/workflows/fs-flow-attack8-body.yml'
  pull_request:
    branches: [feat/fs-agent-sprite-forge-20261125]
    paths:
      - 'tools/agent_orchestration/flow_attack8_preview/**'
      - '.github/workflows/fs-flow-attack8-body.yml'
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Official Godot 4.7.2
        run: |
          curl -fsSL --retry 2 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          test "$(/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version)" = "4.7.2.stable.official.ed1daf0bf"
      - name: Import and test synthetic atlas only
        run: |
          set -euo pipefail
          cd tools/agent_orchestration/flow_attack8_preview
          test ! -e asset/ATTACK8_atlas.png
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --quit
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 240 --script res://test_native.gd | tee /tmp/flow.log
          grep 'FLOW_ATTACK8_NATIVE_PASS scope=SYNTHETIC frames=8 transitions=7 body_only=true' /tmp/flow.log
