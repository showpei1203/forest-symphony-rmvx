name: FS T-B Isolated Godot 4.7.2 Binary Handoff
on:
  push:
    branches:
      - feat/fs-pixellab-tb-monster-20261121
    paths:
      - .github/workflows/fs-tb-godot-binary-handoff-472.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  obtain-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Get pinned official Godot 4.7.2 linux binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot472"
          curl -fSL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot472.zip"
          unzip -q "$RUNNER_TEMP/godot472.zip" -d "$RUNNER_TEMP/godot472"
          binary="$RUNNER_TEMP/godot472/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$binary"
          "$binary" --headless --version | tee "$RUNNER_TEMP/godot472/version.txt"
          grep -q 4.7.2 "$RUNNER_TEMP/godot472/version.txt"
          sha256sum "$binary" | tee "$RUNNER_TEMP/godot472/SHA256SUMS.txt"
      - name: Upload official engine for private in-chat validation
        uses: actions/upload-artifact@v4
        with:
          name: fs-tb-godot-472-linux-bin
          path: ${{ runner.temp }}/godot472/
          retention-days: 1
          if-no-files-found: error
