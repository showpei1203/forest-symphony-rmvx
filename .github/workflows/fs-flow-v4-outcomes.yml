name: FS Flow V4 isolated target outcomes
on:
  push:
    branches: [feat/fs-flow-v4-outcomes-20261126]
    paths: ["godot_port/**", ".github/workflows/fs-flow-v4-outcomes.yml"]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Official 4.7.2
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/engine
          chmod +x /tmp/engine/Godot_v4.7.2-stable_linux.x86_64
          /tmp/engine/Godot_v4.7.2-stable_linux.x86_64 --version | grep -F 4.7.2.stable.official.ed1daf0bf
      - name: Native import and outcomes plus existing source regression
        run: |
          set -euo pipefail
          G=/tmp/engine/Godot_v4.7.2-stable_linux.x86_64
          timeout 75s "$G" --headless --path godot_port --editor --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log; then exit 1; fi
          for test in test_fs_flow_v4_ui test_fs_flow_v4_outcomes test_fs_flow_v4_cover_outcomes test_fs_battle_accuracy_205 test_fs_ivy_cover_native_522; do
            timeout 75s "$G" --headless --path godot_port --script "res://tests/$test.gd" 2>&1 | tee "/tmp/$test.log"
            if grep -E 'SCRIPT ERROR|Parse Error' "/tmp/$test.log"; then exit 1; fi
          done
          grep -F 'FLOW_V4_UI_PASS cases=15 scope=SYNTHETIC' /tmp/test_fs_flow_v4_ui.log
          grep -F 'FLOW_V4_OUTCOME_PASS cases=11 events=7' /tmp/test_fs_flow_v4_outcomes.log
          grep -F 'FLOW_V4_COVER_OUTCOME_PASS cases=3' /tmp/test_fs_flow_v4_cover_outcomes.log
      - name: Transport committed Godot text and public fixtures only
        run: |
          set -euo pipefail
          test ! -e godot_port/motions
          git archive HEAD godot_port -o /tmp/fs-flow-v43-project.zip
          sha256sum /tmp/fs-flow-v43-project.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: fs-flow-v43-committed-project
          path: /tmp/fs-flow-v43-project.zip
          retention-days: 1
          if-no-files-found: error
