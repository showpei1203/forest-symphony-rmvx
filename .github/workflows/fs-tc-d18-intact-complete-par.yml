name: FS T-C D18 Independent CompletePAR Intact Island Contract (Synthetic)
on:
  push:
    branches:
      - feat/fs-tc-d12-chroma-par-20261122
    paths:
      - "godot_port/tc_factory/biomes/fs_tc_d18_complete_par_components.py"
      - "godot_port/tc_factory/biomes/test_fs_tc_d18_complete_par_components.py"
      - ".github/workflows/fs-tc-d18-intact-complete-par.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d18-ground-lock-and-whole-par:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned CI test dependencies in ephemeral runner
        run: python3 -m pip install --disable-pip-version-check Pillow==12.0.0 numpy==2.3.5 scipy==1.17.0
      - name: Test original pixel islands, alpha and source SHA fail-closed gates
        run: python3 godot_port/tc_factory/biomes/test_fs_tc_d18_complete_par_components.py
      - name: Prevent synthetic source QA from certifying private Godot or Art
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("godot_port/tc_factory/biomes/fs_tc_d18_complete_par_components.py").read_text(encoding="utf-8")
          assert '"private_art_Godot_4_7_2_native": "NOT_RUN"' in p
          assert '"formal_ART_PASS": "0/12"' in p
          assert '"polygon_trim_pixels": 0' in p
          print("Structural synthetic gate only. Private D18 Godot 4.7.2 native NOT_RUN and ART HOLD.")
          PY
