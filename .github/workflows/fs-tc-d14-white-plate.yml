name: FS T-C D14 White Foreground to Real Alpha (Synthetic CI)
on:
  push:
    branches:
      - feat/fs-tc-d12-chroma-par-20261122
    paths:
      - "godot_port/tc_factory/biomes/fs_tc_white_plate_to_complete_par.py"
      - "godot_port/tc_factory/biomes/test_fs_tc_white_plate_to_complete_par.py"
      - ".github/workflows/fs-tc-d14-white-plate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-white-plate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install source QA dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.0.0 numpy==2.3.5 scipy==1.17.0
      - name: Test white foreground-only plate to TRUE alpha and fail-closed gates
        run: python3 godot_port/tc_factory/biomes/test_fs_tc_white_plate_to_complete_par.py
      - name: Ensure this cannot claim art or Godot actual native pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("godot_port/tc_factory/biomes/fs_tc_white_plate_to_complete_par.py").read_text()
          assert '"formal_ART_GATE":"HOLD"' in p
          assert '"Godot_4_7_2_native":"NOT_RUN"' in p
          print("Synthetic only: actual private source + Godot native + human Art Gate still required")
          PY
