name: Craft FS public source evidence pilot
on:
  pull_request:
    branches: [feature/fs-godot-phase1]
    paths:
      - 'godot_port/tools/craft_source_pilot.py'
      - '.github/workflows/craft-source-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  craft-public-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/fs-craft-source-pilot-20261126' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run exact signed package and six pinned public source inputs
        shell: pwsh
        run: python -I -B godot_port/tools/craft_source_pilot.py
