name: FS T-A Actor 12-frame Godot 4.7.2 native rig
on:
  push:
    branches:
      - feat/fs-pixellab-ta-actor-20261121
    paths:
      - "godot_port/scripts/animation/FSTAActorMotionRig.gd"
      - "godot_port/tests/test_fs_ta_actor_motion_rig.gd"
      - ".github/workflows/fs-ta-actor.yml"
      - "godot_port/scripts/animation/FSTAActor01Preview.gd"
      - "godot_port/scenes/ta_actor01/TAActor01Preview.tscn"
      - "godot_port/tests/test_fs_ta_actor_preview.gd"
      - "godot_port/tools/ta_actor01_run_weapon.py"
      - "godot_port/tools/ta_actor01_attack_r6_fullbody.py"
      - "godot_port/tools/ta_r11b_lpc_actor01_unarmed.py"
      - "godot_port/tools/ta_r12_actor01_lpc_unarmed_3q.py"
      - "godot_port/tools/ta_r13_verify_lpc_8_direction_source.py"
      - "godot_port/docs/handoff/TA_R13_VERIFIED_LPC_8_DIRECTION_SOURCE_20261122.json"
      - "godot_port/docs/authority/FS_TA_R13_VERIFIED_LPC_EIGHT_DIRECTION_CORRECTION_20261122.md"
      - "godot_port/tools/ta_r12_unarmed_qa_pack.py"
      - "godot_port/tests/capture_ta_r12_unarmed_native.gd"
      - "godot_port/docs/handoff/TA_ACTOR01_R12_LPC_SOURCE_MANIFEST_20261122.json"
      - "godot_port/docs/handoff/TA_ACTOR01_R12_NATIVE_QA_20261122.json"
      - "godot_port/tools/ta_r11b_qa_pack.py"
      - "godot_port/docs/handoff/TA_ACTOR01_R11B_LPC_SOURCE_MANIFEST_20261122.json"
      - "godot_port/tests/capture_ta_r11b_unarmed_native.gd"
      - "godot_port/tools/ta_r8_lpc_actor01_retarget.py"
      - "godot_port/tools/ta_r9_lpc_fixed_bone.py"
      - "godot_port/tests/capture_ta_r9_private_native.gd"
      - "godot_port/docs/handoff/TA_ACTOR01_R8_LPC_SOURCE_POSE_MANIFEST_20261121.json"
      - "godot_port/tools/ta_actor01_attack_r7_high_guard_expression.py"
      - "godot_port/tools/ta_actor01_attack_body_gate.py"
      - "godot_port/tools/ta_actor01_run_r5b.py"
      - "godot_port/tests/capture_ta_actor01_r5b_private.gd"
      - "godot_port/scripts/animation/FSTAActor01ContinuousShowcase.gd"
      - "godot_port/scenes/ta_actor01/TAActor01ContinuousShowcase.tscn"
      - "godot_port/tests/test_fs_ta_actor_continuous_showcase.gd"
      - "godot_port/tests/capture_ta_actor01_continuous_private.gd"
  workflow_dispatch:
jobs:
  ta-native-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Get EXACT official Godot 4.7.2 (not VX)
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Export original official Godot runtime for isolated private cloud QA
        uses: actions/upload-artifact@v4
        with:
          name: fs-ta-official-godot-472-runtime
          path: /tmp/godot.zip
          retention-days: 1
      - name: Import original FS project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --editor --quit
      - name: Check private-asset staging preview scene
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_ta_actor_preview.gd
      - name: Test isolated deterministic A52-sword to RUN12 retarget (synthetic only)
        run: |
          python3 -m pip install 'Pillow==12.3.0'
          python3 godot_port/tools/ta_actor01_run_weapon.py --self-test
      - name: R5B authoritative source SHA-lock safety selftest (mock only)
        run: |
          python3 -m pip install 'opencv-python-headless==4.13.0.92' 'numpy==2.3.5' 'Pillow==12.3.0'
          python3 godot_port/tools/ta_actor01_run_r5b.py --self-test
      - name: Reject attacks whose head and chest are static (synthetic regression)
        run: |
          python3 godot_port/tools/ta_actor01_attack_body_gate.py --self-test
          python3 -m py_compile godot_port/tools/ta_actor01_attack_r6_fullbody.py
      - name: Verify R7 high-guard facial-acting generator syntax (private assets not in public runner)
        run: python3 -m py_compile godot_port/tools/ta_actor01_attack_r7_high_guard_expression.py
      - name: R8 exact-source LPC pose retarget tool syntax and format contract (no private images in CI)
        run: |
          python3 -m py_compile godot_port/tools/ta_r8_lpc_actor01_retarget.py
          python3 - <<'PY'
          import json
          with open('godot_port/docs/handoff/TA_ACTOR01_R8_LPC_SOURCE_POSE_MANIFEST_20261121.json',encoding='utf-8') as file:
              report=json.load(file)
          assert report['frame_count']==12
          assert report['grid']==[4,3] and report['atlas']==[256,192]
          assert len(report['pose_phase'])==12 and report['pose_phase'][7]=='contact'
          assert report['frame7_contact_seconds']==0.630
          assert report['view']=='45_degree_3_4_artist_adaptation_NOT_native_LPC_angle'
          assert report['owner_art_gate']=='HOLD'
          print('R8_LPC_POSE_CONTRACT_12FRAME_SYNTAX_PASS ART_HOLD')
          PY
      - name: R9 fixed upper+forearm bone IK and unreachable-hand negative regression (source-free)
        run: |
          python3 godot_port/tools/ta_r9_lpc_fixed_bone.py --self-test
          python3 -m py_compile godot_port/tools/ta_r9_lpc_fixed_bone.py
      - name: R11B source-only unarmed contract (original art stays private)
        run: |
          python3 -m py_compile godot_port/tools/ta_r11b_lpc_actor01_unarmed.py godot_port/tools/ta_r11b_qa_pack.py
          python3 - <<'PY'
          import json
          d=json.load(open('godot_port/docs/handoff/TA_ACTOR01_R11B_LPC_SOURCE_MANIFEST_20261122.json',encoding='utf8'))
          assert d['official_upstream_commit']=='86a3719ee4a7e2e9fb27c7c152e29a741d3e930a'
          assert d['no_weapon'] and d['weapon_pixels']==0 and d['fx_pixels']==0
          assert d['native_lpc_45_degree_frames'] is False
          assert d['source_frame_columns']==[12,0,1,2,3,6,7,9,10,11,12,12]
          assert d['status'].startswith('ART_HOLD')
          assert len(d['islands_removed_per_frame'])==12 and sum(d['islands_removed_per_frame'])==15
          print('R11B_SYNTHETIC_CI_SOURCE_CONTRACT_PASS; private real native QA stored on owner E')
          PY
      - name: R12 original LPC, zero-weapon and truthful art status CI contract (no private art)
        run: |
          python3 -m py_compile godot_port/tools/ta_r12_actor01_lpc_unarmed_3q.py godot_port/tools/ta_r12_unarmed_qa_pack.py
          python3 - <<'PY'
          import json
          p='godot_port/docs/handoff/'
          m=json.load(open(p+'TA_ACTOR01_R12_LPC_SOURCE_MANIFEST_20261122.json',encoding='utf-8'))
          q=json.load(open(p+'TA_ACTOR01_R12_NATIVE_QA_20261122.json',encoding='utf-8'))
          assert m['official_upstream_commit']=='86a3719ee4a7e2e9fb27c7c152e29a741d3e930a'
          assert m['source_frame_columns']==[12,0,1,2,3,6,7,8,9,10,11,12]
          assert m['no_weapon'] and m['weapon_pixels']==0 and m['fx_pixels']==0
          assert m['native_lpc_45_degree_frames'] is False
          assert m['status'].startswith('ART_HOLD')
          assert len(m['facial_acting_stages'])==12
          assert all(x==0 for x in m['islands_removed_per_frame'])
          assert q['real_native_frames']==73 and q['all_12_poses_single_connected_body']
          assert q['weapon_rgba_opaque_count']==0 and q['fx_rgba_opaque_count']==0
          assert not any(q['source_vs_gpu_exact_RGBA_mismatches_per_pose'])
          assert not any(q['source_vs_gpu_alpha_mismatches_per_pose'])
          assert q['native_source_image_sha256']=='d72366a8945dd0a2824252746b03aa98e209c8aceddffb0d7e30555c1dcb69bb'
          print('R12_SOURCE_MANIFEST_STATIC_CI_PASS / private GPU real source QA separately recorded')
          PY
      - name: R13 eight-direction LPC provenance and attack-scope honesty
        run: |
          python3 -m py_compile godot_port/tools/ta_r13_verify_lpc_8_direction_source.py
          python3 - <<'PY'
          import json
          p='godot_port/docs/handoff/TA_R13_VERIFIED_LPC_8_DIRECTION_SOURCE_20261122.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['source_archive_sha256']=='278bba048b4f25b8c8d9601b2cc27402c298cf1c68c554be9e68c8e11c2ee716'
          assert d['archive_crc_pass'] and d['archive_members']==13
          assert d['male_diagonal_png_shape']==[576,512]
          assert d['original_tile_size']==[64,64]
          assert d['original_direction_rows']==8 and d['original_frames_per_direction']==9
          assert d['contains_diagonal_walk'] is True
          assert d['contains_8_direction_attack'] is False
          assert d['editable_ORA_original_layers']>=1
          print('R13_LPC_8DIR_SOURCE_CONTRACT_PASS, verified WALK not ATTACK')
          PY
      - name: Run T-A three-layer 12-frame animation timing test
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_ta_actor_motion_rig.gd
      - name: Native R4 continuous RUN12x2 to ATTACK12 (synthetic no private PNG)
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_ta_actor_continuous_showcase.gd
      - name: Export R4 exact source-only runner to isolated private QA
        uses: actions/upload-artifact@v4
        with:
          name: fs-ta-r4-private-qa-source-only
          path: |
            godot_port/project.godot
            godot_port/scripts/animation/FSTAActorMotionRig.gd
            godot_port/scripts/animation/FSTAActor01ContinuousShowcase.gd
            godot_port/tests/capture_ta_actor01_continuous_private.gd
            godot_port/scenes/ta_actor01/TAActor01ContinuousShowcase.tscn
          retention-days: 1
