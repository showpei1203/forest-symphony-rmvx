name: FS T-A Actor 12-frame Godot 4.7.2 native rig
on:
  push:
    branches:
      - feat/fs-pixellab-ta-actor-20261121
    paths:
      - "godot_port/scripts/animation/FSTAActorMotionRig.gd"
      - "godot_port/tests/test_fs_ta_actor_motion_rig.gd"
      - ".github/workflows/fs-ta-actor.yml"
      - "godot_port/scripts/animation/FSTAActor01Preview.gd"
      - "godot_port/scenes/ta_actor01/TAActor01Preview.tscn"
      - "godot_port/tests/test_fs_ta_actor_preview.gd"
      - "godot_port/tools/ta_actor01_run_weapon.py"
      - "godot_port/tools/ta_actor01_attack_r6_fullbody.py"
      - "godot_port/tools/ta_r8_lpc_actor01_retarget.py"
      - "godot_port/docs/handoff/TA_ACTOR01_R8_LPC_SOURCE_POSE_MANIFEST_20261121.json"
      - "godot_port/tools/ta_actor01_attack_r7_high_guard_expression.py"
      - "godot_port/tools/ta_actor01_attack_body_gate.py"
      - "godot_port/tools/ta_actor01_run_r5b.py"
      - "godot_port/tests/capture_ta_actor01_r5b_private.gd"
      - "godot_port/scripts/animation/FSTAActor01ContinuousShowcase.gd"
      - "godot_port/scenes/ta_actor01/TAActor01ContinuousShowcase.tscn"
      - "godot_port/tests/test_fs_ta_actor_continuous_showcase.gd"
      - "godot_port/tests/capture_ta_actor01_continuous_private.gd"
  workflow_dispatch:
jobs:
  ta-native-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Get EXACT official Godot 4.7.2 (not VX)
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Export original official Godot runtime for isolated private cloud QA
        uses: actions/upload-artifact@v4
        with:
          name: fs-ta-official-godot-472-runtime
          path: /tmp/godot.zip
          retention-days: 1
      - name: Import original FS project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --editor --quit
      - name: Check private-asset staging preview scene
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_ta_actor_preview.gd
      - name: Test isolated deterministic A52-sword to RUN12 retarget (synthetic only)
        run: |
          python3 -m pip install 'Pillow==12.3.0'
          python3 godot_port/tools/ta_actor01_run_weapon.py --self-test
      - name: R5B authoritative source SHA-lock safety selftest (mock only)
        run: |
          python3 -m pip install 'opencv-python-headless==4.13.0.92' 'numpy==2.3.5' 'Pillow==12.3.0'
          python3 godot_port/tools/ta_actor01_run_r5b.py --self-test
      - name: Reject attacks whose head and chest are static (synthetic regression)
        run: |
          python3 godot_port/tools/ta_actor01_attack_body_gate.py --self-test
          python3 -m py_compile godot_port/tools/ta_actor01_attack_r6_fullbody.py
      - name: Verify R7 high-guard facial-acting generator syntax (private assets not in public runner)
        run: python3 -m py_compile godot_port/tools/ta_actor01_attack_r7_high_guard_expression.py
      - name: R8 exact-source LPC pose retarget tool syntax and format contract (no private images in CI)
        run: |
          python3 -m py_compile godot_port/tools/ta_r8_lpc_actor01_retarget.py
          python3 - <<'PY'
          import json
          with open('godot_port/docs/handoff/TA_ACTOR01_R8_LPC_SOURCE_POSE_MANIFEST_20261121.json',encoding='utf-8') as file:
              report=json.load(file)
          assert report['frame_count']==12
          assert report['grid']==[4,3] and report['atlas']==[256,192]
          assert len(report['pose_phase'])==12 and report['pose_phase'][7]=='contact'
          assert report['frame7_contact_seconds']==0.630
          assert report['view']=='45_degree_3_4_artist_adaptation_NOT_native_LPC_angle'
          assert report['owner_art_gate']=='HOLD'
          print('R8_LPC_POSE_CONTRACT_12FRAME_SYNTAX_PASS ART_HOLD')
          PY
      - name: Run T-A three-layer 12-frame animation timing test
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_ta_actor_motion_rig.gd
      - name: Native R4 continuous RUN12x2 to ATTACK12 (synthetic no private PNG)
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_ta_actor_continuous_showcase.gd
      - name: Export R4 exact source-only runner to isolated private QA
        uses: actions/upload-artifact@v4
        with:
          name: fs-ta-r4-private-qa-source-only
          path: |
            godot_port/project.godot
            godot_port/scripts/animation/FSTAActorMotionRig.gd
            godot_port/scripts/animation/FSTAActor01ContinuousShowcase.gd
            godot_port/tests/capture_ta_actor01_continuous_private.gd
            godot_port/scenes/ta_actor01/TAActor01ContinuousShowcase.tscn
          retention-days: 1
