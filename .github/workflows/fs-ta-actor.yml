name: FS T-A Actor 12-frame Godot 4.7.2 native rig
on:
  push:
    branches:
      - feat/fs-pixellab-ta-actor-20261121
    paths:
      - "godot_port/scripts/animation/FSTAActorMotionRig.gd"
      - "godot_port/tests/test_fs_ta_actor_motion_rig.gd"
      - ".github/workflows/fs-ta-actor.yml"
      - "godot_port/scripts/animation/FSTAActor01Preview.gd"
      - "godot_port/scenes/ta_actor01/TAActor01Preview.tscn"
      - "godot_port/tests/test_fs_ta_actor_preview.gd"
      - "godot_port/tools/ta_actor01_run_weapon.py"
      - "godot_port/tools/ta_actor01_attack_r6_fullbody.py"
      - "godot_port/tools/ta_r11b_lpc_actor01_unarmed.py"
      - "godot_port/tools/ta_r12_actor01_lpc_unarmed_3q.py"
      - "godot_port/tools/ta_r13_verify_lpc_8_direction_source.py"
      - "godot_port/tools/ta_r13_lpc8_actor01_unarmed_attack.py"
      - "godot_port/tools/ta_r14_8dir_two_joint_actor01_unarmed.py"
      - "godot_port/tools/ta_r15_8dir_actor01_punch_kinematics.py"
      - "godot_port/tools/ta_r16_8dir_actor01_shoulder_depth.py"
      - "godot_port/tools/ta_r16_8dir_native_qa_pack.py"
      - "godot_port/tests/capture_ta_r16_unarmed_native.gd"
      - "godot_port/docs/handoff/TA_R16_8DIR_SHOULDER_SOURCE_MANIFEST_20261122.json"
      - "godot_port/docs/handoff/TA_R16_NATIVE_GODOT_QA_20261122.json"
      - "godot_port/docs/authority/FS_TA_R16_8DIR_SHOULDER_HAIR_DEPTH_20261122.md"
      - "godot_port/tools/ta_r15_8dir_native_qa_pack.py"
      - "godot_port/tests/capture_ta_r15_unarmed_native.gd"
      - "godot_port/docs/handoff/TA_R15_8DIR_UNARMED_SOURCE_MANIFEST_20261122.json"
      - "godot_port/docs/handoff/TA_R15_8DIR_UNARMED_NATIVE_QA_20261122.json"
      - "godot_port/docs/authority/FS_TA_R15_8DIR_CHEST_LEVEL_PUNCH_ART_AUTHORITY_20261122.md"
      - "godot_port/tools/ta_r14_8dir_native_qa_pack.py"
      - "godot_port/tests/capture_ta_r14_unarmed_native.gd"
      - "godot_port/docs/handoff/TA_R14_LPC8_TWO_JOINT_SOURCE_MANIFEST_20261122.json"
      - "godot_port/docs/handoff/TA_R14_LPC8_TWO_JOINT_NATIVE_QA_20261122.json"
      - "godot_port/docs/authority/FS_TA_R14_LPC8_TWO_JOINT_UNARMED_AUTHORITY_20261122.md"
      - "godot_port/tools/ta_r13_lpc8_native_qa_pack.py"
      - "godot_port/tests/capture_ta_r13_lpc8_unarmed_native.gd"
      - "godot_port/docs/handoff/TA_R13_TRUE_8DIR_UNARMED_ATTACK_MANIFEST_20261122.json"
      - "godot_port/docs/handoff/TA_R13_8DIR_UNARMED_NATIVE_QA_20261122.json"
      - "godot_port/docs/authority/FS_TA_R13_LPC8_UNARMED_ATTACK_REAUTHORED_20261122.md"
      - "godot_port/docs/handoff/TA_R13_VERIFIED_LPC_8_DIRECTION_SOURCE_20261122.json"
      - "godot_port/docs/authority/FS_TA_R13_VERIFIED_LPC_EIGHT_DIRECTION_CORRECTION_20261122.md"
      - "godot_port/tools/ta_r12_unarmed_qa_pack.py"
      - "godot_port/tests/capture_ta_r12_unarmed_native.gd"
      - "godot_port/docs/handoff/TA_ACTOR01_R12_LPC_SOURCE_MANIFEST_20261122.json"
      - "godot_port/docs/handoff/TA_ACTOR01_R12_NATIVE_QA_20261122.json"
      - "godot_port/tools/ta_r11b_qa_pack.py"
      - "godot_port/docs/handoff/TA_ACTOR01_R11B_LPC_SOURCE_MANIFEST_20261122.json"
      - "godot_port/tests/capture_ta_r11b_unarmed_native.gd"
      - "godot_port/tools/ta_r8_lpc_actor01_retarget.py"
      - "godot_port/tools/ta_r9_lpc_fixed_bone.py"
      - "godot_port/tests/capture_ta_r9_private_native.gd"
      - "godot_port/docs/handoff/TA_ACTOR01_R8_LPC_SOURCE_POSE_MANIFEST_20261121.json"
      - "godot_port/tools/ta_actor01_attack_r7_high_guard_expression.py"
      - "godot_port/tools/ta_actor01_attack_body_gate.py"
      - "godot_port/tools/ta_actor01_run_r5b.py"
      - "godot_port/tests/capture_ta_actor01_r5b_private.gd"
      - "godot_port/scripts/animation/FSTAActor01ContinuousShowcase.gd"
      - "godot_port/scenes/ta_actor01/TAActor01ContinuousShowcase.tscn"
      - "godot_port/tests/test_fs_ta_actor_continuous_showcase.gd"
      - "godot_port/tests/capture_ta_actor01_continuous_private.gd"
  workflow_dispatch:
jobs:
  ta-native-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Get EXACT official Godot 4.7.2 (not VX)
        run: |
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Export original official Godot runtime for isolated private cloud QA
        uses: actions/upload-artifact@v4
        with:
          name: fs-ta-official-godot-472-runtime
          path: /tmp/godot.zip
          retention-days: 1
      - name: Import original FS project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --editor --quit
      - name: Check private-asset staging preview scene
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_ta_actor_preview.gd
      - name: Test isolated deterministic A52-sword to RUN12 retarget (synthetic only)
        run: |
          python3 -m pip install 'Pillow==12.3.0'
          python3 godot_port/tools/ta_actor01_run_weapon.py --self-test
      - name: R5B authoritative source SHA-lock safety selftest (mock only)
        run: |
          python3 -m pip install 'opencv-python-headless==4.13.0.92' 'numpy==2.3.5' 'Pillow==12.3.0'
          python3 godot_port/tools/ta_actor01_run_r5b.py --self-test
      - name: Reject attacks whose head and chest are static (synthetic regression)
        run: |
          python3 godot_port/tools/ta_actor01_attack_body_gate.py --self-test
          python3 -m py_compile godot_port/tools/ta_actor01_attack_r6_fullbody.py
      - name: Verify R7 high-guard facial-acting generator syntax (private assets not in public runner)
        run: python3 -m py_compile godot_port/tools/ta_actor01_attack_r7_high_guard_expression.py
      - name: R8 exact-source LPC pose retarget tool syntax and format contract (no private images in CI)
        run: |
          python3 -m py_compile godot_port/tools/ta_r8_lpc_actor01_retarget.py
          python3 - <<'PY'
          import json
          with open('godot_port/docs/handoff/TA_ACTOR01_R8_LPC_SOURCE_POSE_MANIFEST_20261121.json',encoding='utf-8') as file:
              report=json.load(file)
          assert report['frame_count']==12
          assert report['grid']==[4,3] and report['atlas']==[256,192]
          assert len(report['pose_phase'])==12 and report['pose_phase'][7]=='contact'
          assert report['frame7_contact_seconds']==0.630
          assert report['view']=='45_degree_3_4_artist_adaptation_NOT_native_LPC_angle'
          assert report['owner_art_gate']=='HOLD'
          print('R8_LPC_POSE_CONTRACT_12FRAME_SYNTAX_PASS ART_HOLD')
          PY
      - name: R9 fixed upper+forearm bone IK and unreachable-hand negative regression (source-free)
        run: |
          python3 godot_port/tools/ta_r9_lpc_fixed_bone.py --self-test
          python3 -m py_compile godot_port/tools/ta_r9_lpc_fixed_bone.py
      - name: R11B source-only unarmed contract (original art stays private)
        run: |
          python3 -m py_compile godot_port/tools/ta_r11b_lpc_actor01_unarmed.py godot_port/tools/ta_r11b_qa_pack.py
          python3 - <<'PY'
          import json
          d=json.load(open('godot_port/docs/handoff/TA_ACTOR01_R11B_LPC_SOURCE_MANIFEST_20261122.json',encoding='utf8'))
          assert d['official_upstream_commit']=='86a3719ee4a7e2e9fb27c7c152e29a741d3e930a'
          assert d['no_weapon'] and d['weapon_pixels']==0 and d['fx_pixels']==0
          assert d['native_lpc_45_degree_frames'] is False
          assert d['source_frame_columns']==[12,0,1,2,3,6,7,9,10,11,12,12]
          assert d['status'].startswith('ART_HOLD')
          assert len(d['islands_removed_per_frame'])==12 and sum(d['islands_removed_per_frame'])==15
          print('R11B_SYNTHETIC_CI_SOURCE_CONTRACT_PASS; private real native QA stored on owner E')
          PY
      - name: R12 original LPC, zero-weapon and truthful art status CI contract (no private art)
        run: |
          python3 -m py_compile godot_port/tools/ta_r12_actor01_lpc_unarmed_3q.py godot_port/tools/ta_r12_unarmed_qa_pack.py
          python3 - <<'PY'
          import json
          p='godot_port/docs/handoff/'
          m=json.load(open(p+'TA_ACTOR01_R12_LPC_SOURCE_MANIFEST_20261122.json',encoding='utf-8'))
          q=json.load(open(p+'TA_ACTOR01_R12_NATIVE_QA_20261122.json',encoding='utf-8'))
          assert m['official_upstream_commit']=='86a3719ee4a7e2e9fb27c7c152e29a741d3e930a'
          assert m['source_frame_columns']==[12,0,1,2,3,6,7,8,9,10,11,12]
          assert m['no_weapon'] and m['weapon_pixels']==0 and m['fx_pixels']==0
          assert m['native_lpc_45_degree_frames'] is False
          assert m['status'].startswith('ART_HOLD')
          assert len(m['facial_acting_stages'])==12
          assert all(x==0 for x in m['islands_removed_per_frame'])
          assert q['real_native_frames']==73 and q['all_12_poses_single_connected_body']
          assert q['weapon_rgba_opaque_count']==0 and q['fx_rgba_opaque_count']==0
          assert not any(q['source_vs_gpu_exact_RGBA_mismatches_per_pose'])
          assert not any(q['source_vs_gpu_alpha_mismatches_per_pose'])
          assert q['native_source_image_sha256']=='d72366a8945dd0a2824252746b03aa98e209c8aceddffb0d7e30555c1dcb69bb'
          print('R12_SOURCE_MANIFEST_STATIC_CI_PASS / private GPU real source QA separately recorded')
          PY
      - name: R13 eight-direction LPC provenance and attack-scope honesty
        run: |
          python3 -m py_compile godot_port/tools/ta_r13_verify_lpc_8_direction_source.py
          python3 - <<'PY'
          import json
          p='godot_port/docs/handoff/TA_R13_VERIFIED_LPC_8_DIRECTION_SOURCE_20261122.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['source_archive_sha256']=='278bba048b4f25b8c8d9601b2cc27402c298cf1c68c554be9e68c8e11c2ee716'
          assert d['archive_crc_pass'] and d['archive_members']==13
          assert d['male_diagonal_png_shape']==[576,512]
          assert d['original_tile_size']==[64,64]
          assert d['original_direction_rows']==8 and d['original_frames_per_direction']==9
          assert d['contains_diagonal_walk'] is True
          assert d['contains_8_direction_attack'] is False
          assert d['editable_ORA_original_layers']>=1
          print('R13_LPC_8DIR_SOURCE_CONTRACT_PASS, verified WALK not ATTACK')
          PY
      - name: R13 real 8-dir LPC ORA based original unarmed attack source contract
        run: |
          python3 -m py_compile godot_port/tools/ta_r13_lpc8_actor01_unarmed_attack.py godot_port/tools/ta_r13_lpc8_native_qa_pack.py
          python3 - <<'PY'
          import json
          p='godot_port/docs/handoff/'
          d=json.load(open(p+'TA_R13_TRUE_8DIR_UNARMED_ATTACK_MANIFEST_20261122.json',encoding='utf8'))
          q=json.load(open(p+'TA_R13_8DIR_UNARMED_NATIVE_QA_20261122.json',encoding='utf8'))
          assert d['verified_original_8dir_attack_sprite'] is False
          assert d['explicitly_reauthored_attack'] is True
          assert d['no_weapon'] and d['weapon_opaque_pixels']==0 and d['fx_opaque_pixels']==0
          assert d['source_diagonal_direction_row']==7 and len(d['source_original_frames'])==12
          assert d['sprite_sha']=='04478beeececa0e52e617bf70ca00679bdd77ec8a0c687e50c9a6f7e7010812e'
          assert d['visual_contact_local_seconds']==0.63
          assert d['frame_count']==12 and d['sheet_size']==[256,192]
          assert q['native_60hz_frames']==73 and q['unique_poses']==11
          assert all(v==0 for v in q['native_12poses_source_rgba_byte_differences'])
          assert q['weapon_pixels']==0 and q['fx_pixels']==0
          assert q['status']=='ENGINE_QA_PASS_ART_HOLD'
          print('R13_EIGHT_DIR_REAUTHORED_UNARMED_STATIC_CI_PASS, real private native QA remains owner E')
          PY
      - name: R14 two-joint native 8-dir LPC no-weapon static source contract
        run: |
          python3 -m py_compile godot_port/tools/ta_r14_8dir_two_joint_actor01_unarmed.py godot_port/tools/ta_r14_8dir_native_qa_pack.py
          python3 - <<'PY'
          import json
          p='godot_port/docs/handoff/'
          m=json.load(open(p+'TA_R14_LPC8_TWO_JOINT_SOURCE_MANIFEST_20261122.json',encoding='utf8'))
          q=json.load(open(p+'TA_R14_LPC8_TWO_JOINT_NATIVE_QA_20261122.json',encoding='utf8'))
          assert m['source_original_8dir_anatomy'] is True and m['source_directions']==8
          assert m['source_native_attack'] is False
          assert m['weapon_pixels']==0 and m['fx_pixels']==0
          assert m['frame_count']==12 and m['unique_poses']==11
          assert m['contact_visual_time']==0.630 and m['front_upper_length']==m['back_upper_length']==8.0
          assert m['status'].startswith('ART_HOLD')
          assert len(m['animation'])==12 and sum(x['debris_removed'] for x in m['animation'])==0
          assert [x['face_changed_pixels'] for x in m['animation']]==[0,2,2,2,4,4,5,5,5,1,1,0]
          assert m['sprite_sha256']=='9456aec56f867377a9cea93bdfb86b9b9597efe36a66518a73ce93b2a9e60497'
          assert q['native_frame_count']==73 and q['all_body_continuous']
          assert not any(q['source_vs_gpu_exact_RGBA_byte_mismatches'])
          assert q['weapon_pixels']==0 and q['fx_pixels']==0
          assert q['result']=='ENGINE_QA_PASS_ART_HOLD'
          print('R14_SOURCE_AND_NATIVE_MANIFEST_STATIC_CONTRACT_PASS; true GPU originals owner E')
          PY
      - name: R15 original LPC 8-dir chest-level fist & no-weapon source contract
        run: |
          python3 -m py_compile godot_port/tools/ta_r15_8dir_actor01_punch_kinematics.py godot_port/tools/ta_r15_8dir_native_qa_pack.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('godot_port/docs/handoff')
          m=json.loads((root/'TA_R15_8DIR_UNARMED_SOURCE_MANIFEST_20261122.json').read_text(encoding='utf8'))
          q=json.loads((root/'TA_R15_8DIR_UNARMED_NATIVE_QA_20261122.json').read_text(encoding='utf8'))
          assert m['source_original_8dir_anatomy'] is True and m['source_directions']==8
          assert m['source_native_attack'] is False
          assert m['weapon_pixels']==m['fx_pixels']==0
          assert m['status'].startswith('ART_HOLD')
          assert m['frame_count']==12 and m['unique_poses']==11
          assert m['front_upper_length']==m['back_upper_length']==8.0
          assert m['sprite_sha256']=='dba04b8c0375635789799340e2e6b74df9a9b7410817cb4f52dbef2b549cd675'
          w=m['front_wrist_screen_trajectory']
          assert len(w)==12 and w[0]==w[11]
          assert w[5][0]+3<=w[6][0] and w[6][0]+2<=w[7][0]
          assert 49<=w[7][0]<=55 and 29<=w[7][1]<=35
          assert w[8][0]<w[7][0] and w[9][0]<w[8][0]
          assert q['native_frame_count']==73
          assert not any(q['source_vs_gpu_exact_RGBA_byte_mismatches'])
          assert q['contact_wrist_y_shift_downward_px']>3
          assert q['kinematic_forward_and_recoil_gates_pass'] is True
          assert q['weapon_pixels']==q['fx_pixels']==0
          assert q['result']=='ENGINE_QA_PASS_ART_HOLD'
          print('R15_CH_ESTIMATION_AND_SOURCE_NATIVE_MANIFEST_STATIC_CI_PASS / private real Godot QA on owner E')
          PY
      - name: R16 real eight-dir LPC source shoulder without hair and stable original feet
        run: |
          python3 -m py_compile godot_port/tools/ta_r16_8dir_actor01_shoulder_depth.py godot_port/tools/ta_r16_8dir_native_qa_pack.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('godot_port/docs/handoff')
          m=json.loads((root/'TA_R16_8DIR_SHOULDER_SOURCE_MANIFEST_20261122.json').read_text(encoding='utf8'))
          q=json.loads((root/'TA_R16_NATIVE_GODOT_QA_20261122.json').read_text(encoding='utf8'))
          assert m['source_original_8dir_anatomy'] is True and m['source_directions']==8
          assert m['source_native_attack'] is False
          assert m['weapon_pixels']==0 and m['fx_pixels']==0
          assert m['frame_count']==12 and m['unique_poses']==11
          assert m['status'].startswith('ART_HOLD')
          assert m['headless_shoulders_stay_attached'] is True
          assert m['native_8dir_source_boots_remain_anchored'] is True
          assert m['sprite_sha256']=='9344325b4bd62ba1b1bf6cdf044cc61b17d56fe3af7c14018e9cfd9ae0c04f62'
          rows=m['animation']
          assert len(rows)==12
          assert all(p['headless_body_components']==1 and p['shoulder_overlap_before_hair']>=2 and p['feet_original_source_pixels_untouched'] for p in rows)
          assert sum(p['debris_removed'] for p in rows)==0
          assert rows[7]['shoulder_overlap_before_hair']==7
          assert rows[7]['near_arm_foreground_pixels']>=15
          assert q['native_frame_count']==73 and q['fps']==60
          assert not any(q['source_vs_gpu_exact_RGBA_byte_mismatches'])
          assert q['source_near_arm_shoulder_contact_before_hair'] is True
          assert q['lpc_source_foot_rows_anchored_without_slide'] is True
          assert q['weapon_pixels']==q['fx_pixels']==0
          assert q['result']=='ENGINE_QA_PASS_ART_HOLD'
          print('R16_SOURCED_SHOULDER_BEFORE_HAIR_AND_NATIVE_STATIC_MANIFEST_PASS; real native images private')
          PY
      - name: R17 original 8dir LPC whole-body punch alternate / static source-manifest contract
        run: |
          python3 -m py_compile godot_port/tools/ta_r17_8dir_actor01_full_boxing.py godot_port/tools/ta_r17_8dir_native_qa_pack.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('godot_port/docs/handoff')
          m=json.loads((p/'TA_R17_8DIR_BOXING_SOURCE_MANIFEST_20261122.json').read_text(encoding='utf8'))
          q=json.loads((p/'TA_R17_NATIVE_GODOT_QA_20261122.json').read_text(encoding='utf8'))
          assert m['source_original_8dir_anatomy'] and m['source_directions']==8 and not m['source_native_attack']
          assert m['r17_full_action_repose'] and m['frame_count']==12 and m['unique_poses']==11
          assert m['sprite_sha256']=='1a3001f87278b9244e7282cf0baa110ce10dfd0b159badcb76c4d911e1981587'
          assert m['weapon_pixels']==m['fx_pixels']==0 and m['status'].startswith('ART_HOLD')
          assert m['headless_shoulders_stay_attached'] and m['native_8dir_source_boots_remain_anchored']
          assert all(f['headless_body_components']==1 and f['shoulder_overlap_before_hair']>=2 and f['debris_removed']==0 for f in m['animation'])
          w=m['front_wrist_screen_trajectory']
          assert len(w)==12 and w[0]==w[11]
          assert w[5][0]+3<=w[6][0] and w[6][0]+2<=w[7][0]
          assert 49<=w[7][0]<=55 and 29<=w[7][1]<=35
          assert w[8][0]<w[7][0] and w[9][0]<w[8][0]
          assert q['native_frame_count']==73 and q['fps']==60
          assert not any(q['source_vs_gpu_exact_RGBA_byte_mismatches'])
          assert q['weapon_pixels']==q['fx_pixels']==0 and q['result']=='ENGINE_QA_PASS_ART_HOLD'
          assert q['real_live_FSBattle']=='NOT_RUN'
          print('R17_SOURCE_STATIC_MANIFEST_PASS / original GPU artifact separately owner private / ART_HOLD')
          PY
      - name: R19 Paper Doll source-contract negative gate (known rejected art)
        run: |
          python3 -m py_compile godot_port/tools/ta_actor_paper_doll_source_gate.py
          python3 godot_port/tools/ta_actor_paper_doll_source_gate.py --r19-manifest godot_port/docs/handoff/TA_R19_FIVE_KEYPOSE_SOURCE_MANIFEST_20261122.json
          python3 - <<'PY'
          import importlib.util,json
          p='godot_port/tools/ta_actor_paper_doll_source_gate.py'
          spec=importlib.util.spec_from_file_location('paper_doll_gate',p)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          j=json.load(open('godot_port/docs/handoff/TA_R19_FIVE_KEYPOSE_SOURCE_MANIFEST_20261122.json',encoding='utf-8'))
          outcome=mod.reject_r19(j)
          assert outcome['art_status']=='ART_REJECTED'
          assert outcome['status']=='SOURCE_LAYER_BLOCKED'
          assert not outcome['production_allowed']
          assert 'FORBIDDEN_BODY_RECREATION' in outcome['missing_or_invalid']
          assert 'MISSING_LAYER:torso_outfit' in outcome['missing_or_invalid']
          assert 'MISSING_LAYER:legs_pants' in outcome['missing_or_invalid']
          assert 'MISSING_LAYER:feet_boots' in outcome['missing_or_invalid']
          print('R19_SOURCE_LAYER_REJECTION_GUARD_CONFIRMED; NO ART PASS')
          PY
      - name: R20 A62 source parity manifest / never promote source layers as art
