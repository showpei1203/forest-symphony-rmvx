name: Craft source to Godot differential
on:
  pull_request:
    branches: [feature/fs-godot-phase1]
    paths:
      - 'godot_port/tools/craft_atb_source_oracle.rb'
      - 'godot_port/tests/test_craft_source_differential.gd'
      - '.github/workflows/craft-atb-differential.yml'
permissions:
  contents: read
jobs:
  source-differential:
    if: github.head_ref == 'feat/fs-craft-source-pilot-20261126' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Extract exact original source methods and compute oracle
        run: |
          ruby --version
          ruby godot_port/tools/craft_atb_source_oracle.rb "$RUNNER_TEMP/craft-oracle.json"
          sha256sum "$RUNNER_TEMP/craft-oracle.json"
      - name: Obtain official Godot 4.7.2 as prior FS CI
        run: |
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          sha256sum "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/engine"
          bin="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$bin"
          "$bin" --version | tee "$RUNNER_TEMP/godot-version.txt"
          grep -Fx '4.7.2.stable.official.ed1daf0bf' "$RUNNER_TEMP/godot-version.txt"
          timeout 90s "$bin" --headless --path godot_port --editor --quit
      - name: Actual Godot differential versus source oracle
        run: |
          set -o pipefail
          bin="$RUNNER_TEMP/engine/Godot_v4.7.2-stable_linux.x86_64"
          timeout 60s "$bin" --headless --path godot_port --script res://tests/test_craft_source_differential.gd -- "$RUNNER_TEMP/craft-oracle.json" | tee "$RUNNER_TEMP/diff.log"
          grep -F 'CRAFT_DIFF_SUMMARY; Matches=30; StateGap=1; RecoveryCases=31; AIComparable=2; AIScopeHold=3; Failures=0' "$RUNNER_TEMP/diff.log"
