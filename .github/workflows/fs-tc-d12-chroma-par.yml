name: FS T-C D12 Independent Chroma CompletePAR Contract
on:
  push:
    branches:
      - feat/fs-tc-d12-chroma-par-20261122
      - feat/fs-pixellab-tc-map-20261121
    paths:
      - "godot_port/tc_factory/biomes/fs_complete_par_from_chroma_plate.py"
      - "godot_port/tc_factory/biomes/test_fs_complete_par_from_chroma_plate.py"
      - ".github/workflows/fs-tc-d12-chroma-par.yml"
  pull_request:
    paths:
      - "godot_port/tc_factory/biomes/fs_complete_par_from_chroma_plate.py"
      - "godot_port/tc_factory/biomes/test_fs_complete_par_from_chroma_plate.py"
      - ".github/workflows/fs-tc-d12-chroma-par.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transparent-completepar-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Pillow
        run: python3 -m pip install Pillow==12.0.0
      - name: Synthetic chroma foreground-only plate to transparent PAR
        run: python3 godot_port/tc_factory/biomes/test_fs_complete_par_from_chroma_plate.py
      - name: Confirm no private image or false artwork certification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("godot_port/tc_factory/biomes/fs_complete_par_from_chroma_plate.py").read_text()
          assert '"formal_ART_GATE": "HOLD"' in p
          assert '"Godot_4_7_2_native": "NOT_RUN"' in p
          print("Only a technical alpha bridge; still need real authored PAR / Godot / ART QA")
          PY
