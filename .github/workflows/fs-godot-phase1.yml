name: FS Godot Phase 1 (candidate smoke)

on:
  push:
    branches:
      - feature/fs-godot-phase1
    paths:
      - "godot_port/**"
      - ".github/workflows/fs-godot-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

# Many rapid source commits must not leave dozens of redundant 4.7.2 runners.
concurrency:
  group: fs-godot-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
      - name: Download pinned official Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/fs-godot-engine
          chmod +x /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Make pinned Godot 4.7.2 engine available for isolated private UI QA
        uses: actions/upload-artifact@v4
        with:
          name: fs-p536-public-godot472-engine
          path: /tmp/godot.zip
          if-no-files-found: error
          retention-days: 1
      - name: Package only public Godot candidate code for owner-only asset QA
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r /tmp/fs-p536-public-source.zip godot_port \
            -x '*/.godot/*' -x '*/assets/ui/*' -x '*/assets/battlers/*' \
            -x '*/assets/ta_actor01/*' -x '*/a35_private/*'
          unzip -l /tmp/fs-p536-public-source.zip | head -18
      - name: Publish public-only Godot candidate code archive
        uses: actions/upload-artifact@v4
        with:
          name: fs-p536-public-source
          path: /tmp/fs-p536-public-source.zip
          if-no-files-found: error
          retention-days: 1
      - name: Import project (headless)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --editor --quit
      - name: P538A source-original MENU eight icons, five real actions, four page tabs
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_p538a_original_menu.gd
      - name: P538B source-original complete MENU subpages and operations
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_p538b_original_pages.gd
      - name: P538C source-authentic page rectangles and operations with generated geometry fixture
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_p538c_source_window_geometry.gd
      - name: P538D original source frame slots reserve and visible equipment-denial native QA
        shell: bash
