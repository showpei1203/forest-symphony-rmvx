name: FS Godot Phase 1 (candidate smoke)

on:
  push:
    branches:
      - feature/fs-godot-phase1
    paths:
      - "godot_port/**"
      - ".github/workflows/fs-godot-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

# Many rapid source commits must not leave dozens of redundant 4.7.2 runners.
concurrency:
  group: fs-godot-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
      - name: Download pinned official Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/fs-godot-engine
          chmod +x /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project (headless)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --editor --quit
      - name: Run synthetic VX event commands
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_vx_event_interpreter.gd
      - name: Run synthetic VX event-to-battle bridge
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_vx_battle_bridge.gd
      - name: Test FS Event Studio (compiler, pages, JSON, legacy compatibility)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_event_studio.gd
      - name: Test native Event Studio editor controls
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_event_studio_ui.gd
      - name: Test 2D map marker and treasure chest sample
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_story_map_marker.gd
      - name: Play native dialogue and choice UI test
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_dialogue_panel.gd
      - name: Play 2D story sandbox with chest and NPC
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_story_sandbox.gd
      - name: Preview unsaved event page using actual dialogue player
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_story_preview.gd
      - name: Preview unsaved page through the real event editor button
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_event_studio_editor_preview.gd
      - name: Verify unapproved PC filesystem writes are blocked
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_event_studio_cloud_guard.gd
      - name: Test dynamic action clips and legacy Kaduki compatible playback
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_animation_profiles.gd
      - name: Test source-verified dual-wield equipment and class skills
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_equipment_vx.gd
      - name: Test migrated MENU model (items, learned skills, equipment, formation)
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_menu_model.gd
      - name: Test migrated MENU/BATTLE visual controls and selected-target actions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_menu_battle_ui.gd
      - name: Test conservative source VX HP MP item recovery and refusal safeguards
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_item_recovery.gd
      - name: Test native MENU and BATTLE item selection targeting inventory
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_item_ui.gd
      - name: Test boot-final FS MasterSetup database provenance and 11 SHA guard
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_boot_authority_guard.gd
      - name: Self-test static RGSS2 authority scanner (never executes Ruby)
        shell: bash
        run: |
          set -euo pipefail
          python3 godot_port/tools/rgss2_authority_scan.py --self-test
      - name: Audit actual 505-script FS source order and MasterSetup boot bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 godot_port/tools/rgss2_authority_scan.py --source exported_scripts --expect-count 505 --output "$RUNNER_TEMP/fs_rgss2_static_authority_index.json"
      - name: Upload source-order authority evidence to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: fs-rgss2-static-authority-index
          path: ${{ runner.temp }}/fs_rgss2_static_authority_index.json
          if-no-files-found: error
          retention-days: 30
      - name: Test FS 411 MP Cost Authority and MENU BATTLE quoted payment
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_skill_cost_authority.gd
      - name: Test source 377 direct ComboCore ATB Boss resistance and piercing
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_atb_dynamic_resistance.gd
      - name: Test source Tankentai 1.2c 60fps ATB and ACT charge source parity candidate
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_tankentai_atb_core.gd
      - name: Test live BATTLE Godot UI drives source ATB and MENU freezes
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_tankentai_ui_tick.gd
      - name: Test queued Tankentai actor command ACT payment and interruption
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_atb_action_queue.gd
      - name: Test original enemy AI 210 211 406 roulette distribution conditions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_enemy_ai_source.gd
      - name: Test real 60fps enemy AI auto queue and ACT payment ordering
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_enemy_atb_queue.gd
      - name: Test exact Boss 401 440 core context AI and queued ACT
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_boss_context_ai.gd
      - name: Test TargetPriority 372 Provoke and original target UI queue enforcement
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_target_priority_372.gd
      - name: Test Boss source start summons RNG core ATB and no duplicates
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_boss_start_summons.gd
      - name: Test Boss threshold summons growth authority guard and max8 cap
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_boss_threshold_growth.gd
      - name: Test Boss source phase and core shield state intent only
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_boss_phase_state_intents.gd
      - name: Test Boss source global weather requests and 55pct field thresholds
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_boss_weather_intents.gd
