name: FS Godot Phase 1 (candidate smoke)

on:
  push:
    branches:
      - feature/fs-godot-phase1
    paths:
      - "godot_port/**"
      - ".github/workflows/fs-godot-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
      - name: Download pinned official Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/fs-godot-engine
          chmod +x /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project (headless)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --editor --quit
      - name: Run synthetic VX event commands
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_vx_event_interpreter.gd
      - name: Run synthetic VX event-to-battle bridge
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_vx_battle_bridge.gd
      - name: Test FS Event Studio (compiler, pages, JSON, legacy compatibility)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_event_studio.gd
      - name: Test native Event Studio editor controls
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_event_studio_ui.gd
      - name: Test 2D map marker and treasure chest sample
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_story_map_marker.gd
      - name: Play native dialogue and choice UI test
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_dialogue_panel.gd
      - name: Play 2D story sandbox with chest and NPC
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_story_sandbox.gd
      - name: Preview unsaved event page using actual dialogue player
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_story_preview.gd
      - name: Preview unsaved page through the real event editor button
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_event_studio_editor_preview.gd
      - name: Verify unapproved PC filesystem writes are blocked
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_event_studio_cloud_guard.gd
      - name: Test dynamic action clips and legacy Kaduki compatible playback
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 50s /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_animation_profiles.gd
      - name: Test source-verified dual-wield equipment and class skills
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_equipment_vx.gd
      - name: Test migrated MENU model (items, learned skills, equipment, formation)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/fs-godot-engine/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot_port --script res://tests/test_fs_menu_model.gd
